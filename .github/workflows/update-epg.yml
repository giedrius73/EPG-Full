name: Update EPG

on:
  schedule:
    - cron: "0 */6 * * *"   # kas 6 valandas
  workflow_dispatch:        # leidžia paleisti rankiniu būdu

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          lfs: false   # svarbu: išjungiam LFS

      - name: Download EPG
        run: |
          curl -L -o epg.xml.gz "https://iptvx.one/EPG"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg.xml.gz
          git commit -m "Update EPG file" || echo "No changes to commit"
          git push || echo "Nothing to push"
